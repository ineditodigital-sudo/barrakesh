<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Barrakesh - Booking Confirmed</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Saira+Stencil+One&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FEE101", // Caution Tape Yellow
                        "background-light": "#f8f8f5", 
                        "background-dark": "#111111", // Asphalt Black
                        "surface": "#1E1E1E", // Wet Concrete
                        "accent": "#FF3333", // Spray Paint Red
                        "text-light": "#F2F2F2",
                        "muted": "#666666",
                    },
                    fontFamily: {
                        "display": ["'Saira Stencil One'", "'Space Grotesk'", "sans-serif"],
                        "body": ["'Space Mono'", "monospace"],
                    },
                    backgroundImage: {
                        'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
                    }
                },
            },
        }
    </script>
<style>
        /* Custom Receipt Jagged Edge */
        .receipt-jagged-bottom {
            background: 
                linear-gradient(#F2F2F2 0%, #F2F2F2 100%), 
                linear-gradient(135deg, transparent 10px, #F2F2F2 10px), 
                linear-gradient(225deg, transparent 10px, #F2F2F2 10px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            background-position: 0 0, 0 100%, 0 100%;
            background-repeat: no-repeat, repeat-x, repeat-x;
            /* To make the jagged edge visible, we need to extend the height slightly or use clip-path. 
               Here is a clip-path approach for a cleaner cut. */
            clip-path: polygon(
                0% 0%, 
                100% 0%, 
                100% calc(100% - 10px),
                98% 100%, 96% calc(100% - 10px),
                94% 100%, 92% calc(100% - 10px),
                90% 100%, 88% calc(100% - 10px),
                86% 100%, 84% calc(100% - 10px),
                82% 100%, 80% calc(100% - 10px),
                78% 100%, 76% calc(100% - 10px),
                74% 100%, 72% calc(100% - 10px),
                70% 100%, 68% calc(100% - 10px),
                66% 100%, 64% calc(100% - 10px),
                62% 100%, 60% calc(100% - 10px),
                58% 100%, 56% calc(100% - 10px),
                54% 100%, 52% calc(100% - 10px),
                50% 100%, 48% calc(100% - 10px),
                46% 100%, 44% calc(100% - 10px),
                42% 100%, 40% calc(100% - 10px),
                38% 100%, 36% calc(100% - 10px),
                34% 100%, 32% calc(100% - 10px),
                30% 100%, 28% calc(100% - 10px),
                26% 100%, 24% calc(100% - 10px),
                22% 100%, 20% calc(100% - 10px),
                18% 100%, 16% calc(100% - 10px),
                14% 100%, 12% calc(100% - 10px),
                10% 100%, 8% calc(100% - 10px),
                6% 100%, 4% calc(100% - 10px),
                2% 100%, 0% calc(100% - 10px)
            );
        }

        /* Animation for Receipt Printing */
        @keyframes printReceipt {
            0% {
                transform: translateY(-120%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .animate-print {
            animation: printReceipt 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Barcode Pattern */
        .barcode {
            background-image: linear-gradient(90deg, 
                #000 0%, #000 4%, 
                transparent 4%, transparent 6%, 
                #000 6%, #000 8%, 
                transparent 8%, transparent 9%, 
                #000 9%, #000 14%, 
                transparent 14%, transparent 16%, 
                #000 16%, #000 20%, 
                transparent 20%, transparent 22%, 
                #000 22%, #000 28%, 
                transparent 28%, transparent 30%, 
                #000 30%, #000 34%,
                transparent 34%, transparent 36%, 
                #000 36%, #000 40%, 
                transparent 40%, transparent 44%,
                #000 44%, #000 50%,
                transparent 50%, transparent 54%,
                #000 54%, #000 60%,
                transparent 60%, transparent 64%,
                #000 64%, #000 68%,
                transparent 68%, transparent 72%,
                #000 72%, #000 74%,
                transparent 74%, transparent 76%,
                #000 76%, #000 80%,
                transparent 80%, transparent 84%,
                #000 84%, #000 88%,
                transparent 88%, transparent 92%,
                #000 92%, #000 100%
            );
            height: 40px;
            width: 100%;
        }

        /* Diagonal Stripe Background for Button Hover */
        .btn-hazard:hover {
            background: repeating-linear-gradient(
                45deg,
                #FEE101,
                #FEE101 10px,
                #e6cc00 10px,
                #e6cc00 20px
            );
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-text-light font-body min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Noise Overlay -->
<div class="fixed inset-0 pointer-events-none bg-noise z-0 mix-blend-overlay opacity-30"></div>
<!-- Header (Simple Back) -->
<header class="relative z-10 p-4 flex items-center justify-between">
<button class="text-white hover:text-primary transition-colors">
<span class="material-symbols-outlined !text-[32px]">arrow_back</span>
</button>
<div class="font-display font-bold text-primary tracking-widest text-sm">CONFIRMATION</div>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center p-6 pb-24 w-full max-w-md mx-auto">
<!-- Receipt Container -->
<div class="w-full bg-[#F2F2F2] text-black p-6 pb-12 shadow-[8px_8px_0px_#000000] relative animate-print receipt-jagged-bottom origin-top">
<!-- Logo / Header -->
<div class="text-center border-b-2 border-black pb-4 mb-6 border-dashed">
<h2 class="font-display font-black text-3xl tracking-tighter uppercase leading-none mb-1">BARRAKESH</h2>
<p class="font-body text-xs tracking-widest uppercase">Raw Industrial Cuts</p>
<p class="font-body text-[10px] mt-2 text-gray-600">EST. 2024 /// BROOKLYN, NY</p>
</div>
<!-- Meta Info -->
<div class="flex justify-between items-end mb-6 font-body text-xs uppercase">
<div>
<span class="block text-gray-500 text-[10px]">Date Issued</span>
<span class="font-bold">24 OCT 2024</span>
</div>
<div class="text-right">
<span class="block text-gray-500 text-[10px]">Order No.</span>
<span class="font-bold">#99-8420-X</span>
</div>
</div>
<!-- Barcode -->
<div class="barcode mb-8 opacity-80" data-alt="Stylized aesthetic barcode graphic"></div>
<!-- Line Items -->
<div class="space-y-3 font-body text-sm uppercase mb-6">
<div class="flex justify-between items-start">
<span class="text-gray-600">Service</span>
<span class="font-bold text-right">Razor Skin Fade<br/><span class="text-[10px] font-normal text-gray-500">w/ Hot Towel</span></span>
</div>
<div class="flex justify-between items-center">
<span class="text-gray-600">Barber</span>
<span class="font-bold">K-Cut</span>
</div>
<div class="flex justify-between items-center">
<span class="text-gray-600">Time</span>
<span class="font-bold">14:00 - 14:45</span>
</div>
</div>
<!-- Total -->
<div class="border-t-2 border-black border-dashed pt-4 mb-8 flex justify-between items-center font-display font-bold text-xl">
<span>TOTAL</span>
<span>$35.00</span>
</div>
<!-- Stamped Status -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rotate-[-15deg] pointer-events-none mix-blend-multiply opacity-90 border-[4px] border-accent p-2">
<span class="font-display font-black text-4xl text-accent uppercase tracking-widest opacity-80">BOOKED</span>
</div>
<!-- Fine Print -->
<div class="text-center font-body text-[10px] text-gray-500 uppercase leading-relaxed">
<p>Please arrive 10 min early.</p>
<p>Cash only. No refunds for no-shows.</p>
<p class="mt-2">*** KEEP THIS TICKET ***</p>
</div>
</div>
</main>
<!-- Floating Action Buttons -->
<footer class="fixed bottom-0 left-0 w-full z-20 p-6 bg-gradient-to-t from-[#111111] via-[#111111] to-transparent">
<div class="flex flex-col gap-3 w-full max-w-md mx-auto">
<!-- Primary Action: Get Directions -->
<button class="w-full h-14 bg-primary text-black font-display font-bold uppercase tracking-wide text-lg border-2 border-primary hover:bg-[#e6cc00] btn-hazard transition-all shadow-[4px_4px_0px_#000] active:translate-y-[2px] active:shadow-[2px_2px_0px_#000] flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined group-hover:rotate-45 transition-transform">near_me</span>
                Get Directions
            </button>
<!-- Secondary Action: Add to Calendar -->
<button class="w-full h-14 bg-transparent text-white font-display font-bold uppercase tracking-wide text-sm border-2 border-white hover:bg-white hover:text-black transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">calendar_today</span>
                Add To Calendar
            </button>
</div>
</footer>
</body></html>
